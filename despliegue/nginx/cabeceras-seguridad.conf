# Cabeceras de seguridad de toda respuesta. Se incluye en el server y en CADA
# location que declare add_header, porque un add_header dentro de un location
# anula los que hereda del server. Con `always` salen también en 404, 413 y 502.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
